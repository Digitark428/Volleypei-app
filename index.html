<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8"/>
    <!-- Viewport : viewport-fit=cover est CRITIQUE pour les safe-areas iOS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>

    <!-- Theme color : assorti à la nav semi-transparente -->
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#fbfbfd"/>

    <!-- iOS Web App (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="mobile-web-app-capable" content="yes"/>
    <!-- "default" => la barre de statut iOS reste visible et NE recouvre PAS la page.
         (black-translucent recouvre le contenu et coupe le haut sans gestion safe-area
         côté webview iOS standalone — d'où le bug constaté.) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="apple-mobile-web-app-title" content="VolleyPéi"/>
    <meta name="format-detection" content="telephone=no"/>

    <meta name="description" content="VolleyPéi — Le calendrier officiel du volley à La Réunion"/>
    <title>VolleyPéi 🏐</title>

    <!-- Manifest PWA -->
    <link rel="manifest" href="/manifest.webmanifest"/>

    <!-- Icônes (réutilise le favicon du logo embarqué) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>

    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

    <!-- Leaflet (carte) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Pré-styles critiques : fond + safe-area dès le 1er paint pour éviter le flash -->
    <style>
      html, body {
        background: #fbfbfd;
        margin: 0;
        padding: 0;
        /* iOS PWA : reserve l'espace de la "Dynamic Island" / encoche */
        padding-top: env(safe-area-inset-top);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
        min-height: 100vh;
        min-height: 100dvh; /* mieux que vh sur mobile */
      }
      /* iOS standalone : le body est rétréci par les safe-area paddings — on bouche les bords */
      @supports (padding-top: env(safe-area-inset-top)) {
        body { background: #fbfbfd; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
